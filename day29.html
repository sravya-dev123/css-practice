    <style>
div {
  border: 1px solid black;
  padding: 25px 50px;
  background-color: lightblue;
}

padding: 25px 50px;
top padding is 25px
right and left paddings are 50px
-->

<div>This div element has a bottom padding of 25px, a right and left padding of 50px.</div>
